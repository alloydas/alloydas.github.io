name: Fetch Publications from OpenAlex

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  fetch-publications:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a PAT so the auto-commit below counts as repository activity
          # (keeps GitHub from disabling this cron after 60 days) and so the
          # push triggers deploy.yml. Falls back to GITHUB_TOKEN if unset.
          token: ${{ secrets.PAT || github.token }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pyyaml
      - name: Fetch publications from OpenAlex
        run: python scripts/fetch_publications.py
      - name: Commit and push updated papers.bib
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _bibliography/papers.bib
          git diff --staged --quiet || git commit -m "chore: auto-update publications"
          git push
